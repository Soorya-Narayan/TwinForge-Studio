<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwinForge Studio · Booting</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #000000;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      border-radius: 20px;
    }
    .boot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
    }
    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      animation: appleFadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .progress-bar-track {
      width: 175px;
      height: 5px;
      background: #262626;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 999px;
      transition: width 0.12s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes appleFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="boot-container">
    <img src="./gooselogo.png" alt="Logo" class="logo" />
    <div class="progress-bar-track">
      <div id="progress" class="progress-bar-fill"></div>
    </div>
  </div>

  <script>
    const progressElem = document.getElementById('progress');
    let p = 0;
    const interval = setInterval(() => {
      p += Math.floor(Math.random() * 8) + 6;
      if (p >= 100) {
        p = 100;
        clearInterval(interval);
      }
      progressElem.style.width = p + '%';
    }, 65);
  </script>
</body>
</html>
