<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwinForge Studio · Starting...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 28px;
      width: 100%;
    }
    .logo-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo-glow {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.35) 0%, rgba(2, 132, 199, 0) 70%);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .progress-bar {
      width: 240px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      transition: width 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .status-text {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #64748b;
      margin-bottom: 18px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .version-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #38bdf8;
      letter-spacing: 0.05em;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img src="./gooselogo.png" alt="Goose Logo" class="logo" />
    </div>

    <div class="title">TwinForge Studio</div>
    <div class="subtitle">Virtual Commissioning Suite</div>

    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>

    <div id="status" class="status-text">Booting core engine...</div>

    <div class="version-badge">
      <div class="dot"></div>
      <span>v1.0.0</span>
    </div>
  </div>

  <script>
    const statusElem = document.getElementById('status');
    const progressElem = document.getElementById('progress');

    const steps = [
      { progress: 18, text: 'Initializing physics runtime...' },
      { progress: 42, text: 'Loading ISA-101 HMI mimics...' },
      { progress: 70, text: 'Configuring deterministic scan loop...' },
      { progress: 88, text: 'Verifying safety interlock matrix...' },
      { progress: 100, text: 'Starting TwinForge Studio...' },
    ];

    let currentStep = 0;

    function advance() {
      if (currentStep < steps.length) {
        const step = steps[currentStep];
        progressElem.style.width = step.progress + '%';
        statusElem.innerText = step.text;
        currentStep++;
        const delay = currentStep === steps.length ? 300 : 280;
        setTimeout(advance, delay);
      }
    }

    setTimeout(advance, 100);
  </script>
</body>
</html>
